[project]
name = "hanoi-crossing"
version = "0.1.0"
description = "Hanoi Crossing: a two-player, partially-observed Tower of Hanoi variant with a reusable game engine."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.scripts]
hanoi-replay = "hanoi_crossing.cli.replay:main"
hanoi-random = "hanoi_crossing.cli.random_play:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hanoi_crossing"]

[tool.pytest.ini_options]
testpaths = ["tests"]
